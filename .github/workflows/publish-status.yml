name: Publish project status

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import GitHub issues and build the report
        env:
          GITHUB_TOKEN: ${{ secrets.TOODLES_GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.TOODLES_GITHUB_ORG }}
          GITHUB_PROJECT: ${{ vars.TOODLES_GITHUB_PROJECT }}
          GITHUB_PROJECT_NUMBER: ${{ vars.TOODLES_GITHUB_PROJECT_NUMBER }}
        run: python3 -m toodles --import -o output/index.html

      - name: Disable Jekyll
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
